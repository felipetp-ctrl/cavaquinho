[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cavaquinho"
version = "0.3.0"
description = "A lightweight Python library for hallucination detection and explainability in LLM responses, with claim-level faithfulness verification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Felipe Tomé Pereira" }
]
keywords = [
    "hallucination",
    "llm",
    "faithfulness",
    "nlp",
    "explainability",
    "rag",
    "nli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "nltk>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
nli = [
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-mock",
    "ruff>=0.4.0",
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
]
rag = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "faiss-cpu>=1.7.0,<2.0.0",
    "sentence-transformers>=2.0.0,<4.0.0",
]

[project.scripts]
cavaquinho = "cavaquinho._cli:main"

[project.urls]
Homepage = "https://github.com/felipetp-ctrl/cavaquinho"
Repository = "https://github.com/felipetp-ctrl/cavaquinho"
Issues = "https://github.com/felipetp-ctrl/cavaquinho/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cavaquinho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["cavaquinho"]
omit = [
    "benchmarks/*",
    "cavaquinho/classifier/deberta.py",  # requires live model — covered by integration tests
    "cavaquinho/classifier/minicheck.py",  # requires live model — covered by integration tests
    "cavaquinho/_cli.py",  # CLI entry point — covered by integration tests
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.\\s*$",
]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter